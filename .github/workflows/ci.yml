name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · bundle, unit and render tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Committed bundles match the sources
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Render smoke test
        run: npm run test:render -- --shots shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: shots
          if-no-files-found: ignore

  macos:
    name: macOS · build, launch and package
    runs-on: macos-latest
    env:
      APP: build/Release/Desk Piggy.app
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Build (universal, ad-hoc signed)
        run: |
          set -o pipefail
          VERSION_ARGS=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_ARGS=("MARKETING_VERSION=${GITHUB_REF_NAME#v}" "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER")
          fi
          xcodebuild -project macos/DeskPiggy.xcodeproj -target DeskPiggy -configuration Release \
            SYMROOT="$PWD/build" OBJROOT="$PWD/build/obj" "${VERSION_ARGS[@]}" build 2>&1 | tee build.log

      - name: Build problems
        if: failure()
        run: |
          grep -nE "error:|BUILD FAILED|The following build commands failed" -A4 build.log | tail -n 200 || true

      - name: Inspect the bundle
        run: |
          test -d "$APP"
          /usr/libexec/PlistBuddy -c Print "$APP/Contents/Info.plist"
          echo "--- resources"
          find "$APP/Contents/Resources" -maxdepth 2 | sort
          test -f "$APP/Contents/Resources/pet.html"
          test -d "$APP/Contents/Resources/Metadata.appintents"
          echo "--- App Intents metadata"
          python3 - "$APP/Contents/Resources/Metadata.appintents/extract.actionsdata" <<'PY' || true
          import json, sys
          data = json.load(open(sys.argv[1]))
          print("keys:", sorted(data))
          print("actions:", len(data.get("actions", {})))
          shortcuts = data.get("autoShortcuts", [])
          print("app shortcuts:", len(shortcuts))
          print(json.dumps(shortcuts, ensure_ascii=False)[:3000])
          PY
          echo "--- binary"
          lipo -archs "$APP/Contents/MacOS/Desk Piggy"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Launch and self-check
        run: |
          DESKPIGGY_SMOKE_REPORT="$PWD/smoke.json" "$APP/Contents/MacOS/Desk Piggy" &
          PID=$!
          # The app creates smoke.json.pose once the pig is on screen and holding still.
          for i in $(seq 1 120); do
            [ -f smoke.json.pose ] && break
            kill -0 "$PID" 2>/dev/null || break
            sleep 0.5
          done
          [ -f smoke.json.pose ] && screencapture -x with-pig.png
          STATUS=0
          wait "$PID" || STATUS=$?
          echo "exit status: $STATUS"
          cat smoke.json 2>/dev/null || echo "no report was written"
          if [ "$STATUS" -eq 3 ]; then
            echo "::warning::This runner's web view has no WebGL, so the pig could not be drawn here. The bridge itself was not exercised."
            exit 0
          fi
          [ "$STATUS" -eq 0 ] || exit "$STATUS"
          sleep 1
          screencapture -x without-pig.png

      - name: The pig is really on screen
        run: |
          # Compare the screen with and without the app, inside the pig's window. This is what
          # catches "everything reports fine but nothing is visible".
          if [ ! -f with-pig.png ] || [ ! -f without-pig.png ]; then
            echo "::warning::No screenshots to compare, so the on-screen check was skipped."
            exit 0
          fi
          python3 -m venv .venv
          .venv/bin/pip install --quiet pillow
          .venv/bin/python - <<'PY'
          import json, re
          from PIL import Image, ImageChops

          report = json.load(open("smoke.json"))
          win = report["window"]
          _, _, screen_w, screen_h = map(float, re.findall(r"[-\d.]+", report["screens"][0]))
          shown = Image.open("with-pig.png").convert("RGB")
          empty = Image.open("without-pig.png").convert("RGB")
          k = shown.width / screen_w  # screenshots are in pixels, window frames in points
          box = tuple(round(v * k) for v in (win["x"], screen_h - win["y"] - win["height"], win["x"] + win["width"], screen_h - win["y"]))
          diff = ImageChops.difference(shown.crop(box), empty.crop(box)).convert("L")
          changed = sum(1 for v in diff.getdata() if v > 24) / (diff.width * diff.height)
          print(f"The pig's window differs from the empty desktop in {changed:.1%} of its pixels.")
          shown.crop(box).save("pig-on-screen.png")
          assert changed > 0.05, "the pig is not visible on screen"
          PY
          # TEMPORARY: show the crop in the log (artifacts cannot be fetched during development).
          sips -s format jpeg -s formatOptions 60 pig-on-screen.png --out pig.jpg >/dev/null 2>&1 && { echo "-----BEGIN SHOT-----"; base64 -i pig.jpg | fold -w 180; echo "-----END SHOT-----"; }

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$APP" DeskPiggy-macOS.zip
          shasum -a 256 DeskPiggy-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DeskPiggy-macOS
          path: DeskPiggy-macOS.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-diagnostics
          path: |
            build.log
            smoke.json
            with-pig.png
            without-pig.png
            pig-on-screen.png
          if-no-files-found: ignore

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DeskPiggy-macOS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" DeskPiggy-macOS.zip \
            --title "Desk Piggy $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
